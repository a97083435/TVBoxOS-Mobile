title = "TVboxOSC secret detection"

[extend]
useDefault = true

[[rules]]
id = "wireguard-private-key"
description = "WireGuard private keys in YAML and local configuration"
regex = '''(?i)private[-_]key\s*[:=]\s*["']?([A-Za-z0-9+/]{43}=)'''
secretGroup = 1
keywords = ["private-key", "private_key"]
