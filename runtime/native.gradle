// Keep native payloads out of the host. Downloads are pinned in prepare_optional_runtimes.py.
plugins.apply('com.android.application')
android {
    namespace "com.kukuqi.tvbox.runtime.${project.name.substring(8)}"
    compileSdk 37
    defaultConfig {
        applicationId namespace
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    sourceSets.main {
        assets.srcDir(layout.buildDirectory.dir('payload/assets').get().asFile)
        jniLibs.srcDir(layout.buildDirectory.dir('payload/jniLibs').get().asFile)
    }
    sourceSets.main.res.srcDir(rootProject.file("runtime/icons/${project.name.substring(8)}"))
    packaging { jniLibs { useLegacyPackaging true } }
    buildTypes { release { minifyEnabled false } }
}
dependencies { coreLibraryDesugaring libs.desugar }
def signingStore = rootProject.file('TVBoxOSC.jks')
if (signingStore.exists()) {
    android.signingConfigs.create('host') {
        storeFile signingStore
        storePassword System.getenv('TVBOX_STORE_PASSWORD') ?: 'TVBoxOSC'
        keyAlias System.getenv('TVBOX_KEY_ALIAS') ?: 'TVBoxOSC'
        keyPassword System.getenv('TVBOX_KEY_PASSWORD') ?: 'TVBoxOSC'
    }
    android.buildTypes.configureEach { signingConfig android.signingConfigs.host }
}
tasks.register('preparePayload', Exec) {
    workingDir rootProject.projectDir
    commandLine(System.getenv('TVBOX_TOOLS_PYTHON') ?: 'python3', 'scripts/prepare_optional_runtimes.py', project.name.substring(8))
    inputs.file(rootProject.file('scripts/prepare_optional_runtimes.py'))
    inputs.dir(project.file('src/main/cpp'))
    outputs.dir(layout.buildDirectory.dir('payload'))
}
tasks.named('preBuild').configure { dependsOn 'preparePayload' }
