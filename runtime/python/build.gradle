plugins { id 'com.android.application' }
android {
    namespace 'com.kukuqi.tvbox.runtime.python'
    compileSdk 37
    defaultConfig {
        applicationId 'com.kukuqi.tvbox.runtime.python'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.0.2'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    sourceSets.main.res.srcDir(rootProject.file("runtime/icons/python"))
    packaging { jniLibs { useLegacyPackaging true } }
    buildTypes { release { minifyEnabled false } }
}
// Release modules must use the same certificate as the host APK.
def signingStore = rootProject.file('TVBoxOSC.jks')
if (signingStore.exists()) {
    android.signingConfigs.create('host') {
        storeFile signingStore
        storePassword System.getenv('TVBOX_STORE_PASSWORD') ?: 'TVBoxOSC'
        keyAlias System.getenv('TVBOX_KEY_ALIAS') ?: 'TVBoxOSC'
        keyPassword System.getenv('TVBOX_KEY_PASSWORD') ?: 'TVBoxOSC'
    }
    android.buildTypes.configureEach { signingConfig android.signingConfigs.host }
}
dependencies {
    implementation project(':python-runtime')
    compileOnly project(':source-runtime')

    coreLibraryDesugaring libs.desugar
}
