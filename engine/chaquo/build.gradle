plugins {
    id 'com.android.library'
    id 'com.chaquo.python'
}

android {
    namespace = 'com.kukuqi.tvbox.engine.python'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        // Match the host APK: Chaquopy embeds ABI-specific assets independently of jniLibs.
        ndk { abiFilters "arm64-v8a" }
        python {
            version = "3.10"
            if (System.getenv('TVBOX_BUILD_PYTHON')) buildPython System.getenv('TVBOX_BUILD_PYTHON')
            pyc { src = false; pip = false }
            pip {
                install("-r", "requirements.txt")
            }
        }
    }

    sourceSets {
        main {
            python.srcDirs = ["src/main/python"]
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    compileOnly project(':source-runtime')
    coreLibraryDesugaring libs.desugar
}
